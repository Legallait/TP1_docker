services:
  database:
    build: .
    image: ${IMAGE_DATABASE}
    container_name: database
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - back-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: "./Backend API/simpleapi"
    image: ${IMAGE_BACKEND}
    container_name: backend-api
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - back-network
      - front-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  httpd:
    build:
      context: "./HTTP Server"
      args:
        BACKEND_HOST: ${BACKEND_HOST}
    image: ${IMAGE_HTTPD}
    container_name: http-server
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - front-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  adminer:
    image: ${IMAGE_ADMINER}
    container_name: adminer
    environment:
      ADMINER_DEFAULT_SERVER: database
    depends_on:
      database:
        condition: service_healthy
    networks:
      - back-network
      - front-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  autoheal:
    image: ${IMAGE_AUTOHEAL}
    container_name: autoheal
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

networks:
  back-network:
    name: back-network
  front-network:
    name: front-network

volumes:
  pgdata: